spring.application.name=ecomart
spring.ai.google.genai.api-key=
spring.ai.google.genai.chat.model=models/gemini-3.5-flash

# Habilita e ajusta a política de retry do Spring AI
spring.ai.retry.max-attempts=5
spring.ai.retry.backoff.initial-interval=2000ms
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=10000ms
